name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, complexity, coupling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint and type check (cyclomatic < 10, cognitive <= 10)
        run: npm run lint

      - name: Coupling (cycles, Core purity, Stable Dependency Principle)
        run: npm run check:deps

      - name: Duplication
        run: npm run check:duplicates

      - name: Build
        run: npm run build

  test:
    name: Tests and Core coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tests with Core coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  mutation:
    name: Mutation on changed Core files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Determine changed Core files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # Fail loudly rather than silently mutating nothing: an unresolvable
          # base makes every diff empty, which would look like a clean pass.
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::Cannot resolve base revision '$BASE'; refusing to report a pass."
            exit 1
          fi

          # Pathspec is the directory, not 'src/core/**/*.ts' — in a git
          # pathspec '**' must be a whole path component, so that pattern
          # silently matches nothing directly inside src/core.
          ALL=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- src/core)
          echo "Core files in diff:"
          echo "${ALL:-  (none)}"

          FILES=$(printf '%s\n' "$ALL" \
            | { grep -E '\.ts$' || true; } \
            | { grep -vE '\.(test|spec)\.ts$' || true; } \
            | paste -sd, -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No Core files to mutate."
          else
            echo "Mutating: $FILES"
          fi

      - name: Mutation test
        if: steps.changed.outputs.files != ''
        run: npx stryker run --mutate "${{ steps.changed.outputs.files }}"

      - name: Upload mutation report
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
