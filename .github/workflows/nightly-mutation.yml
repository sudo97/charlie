name: Nightly full-Core mutation

# Per-PR mutation only covers the changed Core surface. This run catches drift
# across the whole Core. See DISCIPLINE.md, CI: The Referee.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full Core mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Mutation test the entire Core
        run: npm run mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-full
          path: reports/mutation/
          retention-days: 30
